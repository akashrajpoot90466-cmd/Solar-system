 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System & Complete World Atlas</title>
    
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
    
    <style>
     body, .chip, #hoverTooltip {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
}
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030511;
            background-image: radial-gradient(circle at center, #0a1026 0%, #020308 100%);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* Top Right Side Control Panel */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            flex-wrap: wrap;
        }

        .instruction-badge {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .instruction-badge span { color: #60a5fa; font-weight: bold; }

        .control-btn {
            background: rgba(37, 99, 235, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .control-btn:hover {
            background: rgba(37, 99, 235, 1);
            transform: translateY(-2px);
        }

        .music-upload-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .music-upload-btn:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        .sound-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #38bdf8;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .sound-btn:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        /* Solar System Stage */
        .solar-system-stage {
            width: 90vmin;
            height: 90vmin;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sun {
            position: absolute;
            width: 8vmin; height: 8vmin;
            background: radial-gradient(circle, #fff7ad 0%, #ffd700 50%, #ff8c00 100%);
            border-radius: 50%;
            box-shadow: 0 0 3vmin #ffae00, 0 0 6vmin #ff4500;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s;
        }
        .sun:hover { transform: scale(1.15); }

        .orbit {
            position: absolute;
            border: 0.1vmin solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            pointer-events: none;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .murcury { width: 14vmin; height: 14vmin; animation: orbit 4s linear infinite; }
        .murcuryshape { top: -0.7vmin; left: 50%; transform: translateX(-50%); width: 1.4vmin; height: 1.4vmin; background-color: #a5a5a5; border-radius: 50%; position: absolute; cursor: pointer; pointer-events: auto; }

        .venus { width: 22vmin; height: 22vmin; animation: orbit 7s linear infinite; }
        .venusshape { top: -1vmin; left: 50%; transform: translateX(-50%); width: 2vmin; height: 2vmin; background-color: #e3bb76; border-radius: 50%; position: absolute; cursor: pointer; pointer-events: auto; }

        .earth { width: 32vmin; height: 32vmin; animation: orbit 11s linear infinite; }
        .earthshape {
            position: absolute; top: -1.3vmin; left: 50%; transform: translateX(-50%);
            width: 2.6vmin; height: 2.6vmin;
            background: linear-gradient(135deg, #1d4ed8 0%, #10b981 100%);
            border-radius: 50%; cursor: pointer; pointer-events: auto;
            box-shadow: 0 0 1vmin #3b82f6;
            animation: pulse-earth 2s infinite ease-in-out;
        }
        @keyframes pulse-earth {
            0%, 100% { box-shadow: 0 0 0.8vmin #3b82f6; }
            50% { box-shadow: 0 0 1.8vmin #60a5fa; }
        }

        .mars { width: 41vmin; height: 41vmin; animation: orbit 15s linear infinite; }
        .marsshape { top: -0.9vmin; left: 50%; transform: translateX(-50%); width: 1.8vmin; height: 1.8vmin; background-color: #ef4444; border-radius: 50%; position: absolute; cursor: pointer; pointer-events: auto; }

        .jupiter { width: 52vmin; height: 52vmin; animation: orbit 20s linear infinite; }
        .jupitershape { top: -1.9vmin; left: 50%; transform: translateX(-50%); width: 3.8vmin; height: 3.8vmin; background: linear-gradient(180deg, #c084fc 0%, #b45309 50%, #78350f 100%); border-radius: 50%; position: absolute; cursor: pointer; pointer-events: auto; }

        .saturn { width: 63vmin; height: 63vmin; animation: orbit 25s linear infinite; }
        .saturnshape { top: -1.6vmin; left: 50%; transform: translateX(-50%); width: 3.2vmin; height: 3.2vmin; background-color: #fde047; border-radius: 50%; position: absolute; cursor: pointer; pointer-events: auto; }
        .saturnshape::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            width: 5.5vmin; height: 5.5vmin;
            border: 0.4vmin solid rgba(253, 224, 71, 0.6); border-radius: 50%;
        }

        .uranus { width: 74vmin; height: 74vmin; animation: orbit 30s linear infinite; }
        .uranusshape { top: -1.3vmin; left: 50%; transform: translateX(-50%); width: 2.6vmin; height: 2.6vmin; background-color: #22d3ee; border-radius: 50%; position: absolute; cursor: pointer; pointer-events: auto; }

        .naptune { width: 85vmin; height: 85vmin; animation: orbit 35s linear infinite; }
        .naptuneshape { top: -1.25vmin; left: 50%; transform: translateX(-50%); width: 2.5vmin; height: 2.5vmin; background-color: #3b82f6; border-radius: 50%; position: absolute; cursor: pointer; pointer-events: auto; }

        @keyframes orbit { to { transform: translate(-50%, -50%) rotate(360deg); } }
        .paused .orbit { animation-play-state: paused !important; }

        .murcuryshape:hover, .venusshape:hover, .earthshape:hover, 
        .marsshape:hover, .jupitershape:hover, .saturnshape:hover, 
        .uranusshape:hover, .naptuneshape:hover {
            outline: 2px solid #fff; outline-offset: 3px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 5, 17, 0.9); backdrop-filter: blur(12px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .planet-card {
            background: rgba(15, 23, 42, 0.96); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px; width: 92%; max-width: 750px; padding: 24px; position: relative;
            display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
        }
        #planet3dBox {
            width: 260px; height: 260px; border-radius: 16px;
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            border: 1px solid rgba(255,255,255,0.1); cursor: grab;
        }
        .planet-info-box { flex: 1; min-width: 260px; }
        .close-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .close-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        .earth-explorer-container {
            width: 96vw; height: 94vh; max-width: 1500px;
            background: rgba(11, 15, 25, 0.97); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px; display: flex; overflow: hidden;
            box-shadow: 0 0 80px rgba(0, 102, 255, 0.3); position: relative;
        }

        .globe-viewport { flex: 1.15; position: relative; background: radial-gradient(circle at center, #081229 0%, #02040a 100%); min-height: 300px; }
        #globe3dCanvas { width: 100%; height: 100%; min-height: 300px; }

        #hoverTooltip {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            pointer-events: none;
            display: none;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.5);
            transform: translate(-50%, -140%);
            white-space: nowrap;
        }

        .earth-sidebar {
            width: 500px;
            background: rgba(15, 23, 42, 0.98);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 18px 20px;
            overflow-y: auto;
            gap: 12px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 10px;
        }
        .header-title-group { display: flex; flex-direction: column; }
        .header-title { font-size: 13px; color: #38bdf8; font-weight: 700; letter-spacing: 0.5px; }
        .header-subtitle { font-size: 11px; color: #94a3b8; }

        .search-box { position: relative; flex-shrink: 0; }
        .search-box input {
            width: 100%;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 10px 14px 10px 38px;
            border-radius: 12px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
        }
        .search-box input:focus { border-color: #3b82f6; }
        .search-box i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #64748b; }

        .continent-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }
        .tab-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            color: #e2e8f0;
            transition: 0.15s;
        }
        .tab-btn:hover { border-color: #60a5fa; }
        .tab-btn.active { background: #2563eb; border-color: #60a5fa; color: #fff; font-weight: 600; }

        .country-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-content: flex-start;
            min-height: 95px;
            max-height: 130px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(2, 6, 23, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .chip {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 11px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            color: #e2e8f0;
            transition: 0.15s;
            line-height: 1.2;
        }
        .chip:hover { border-color: #60a5fa; background: rgba(51, 65, 85, 0.9); }
        .chip.active { background: #2563eb; border-color: #93c5fd; color: #fff; font-weight: 600; }

        .details-panel { flex-shrink: 0; padding-top: 4px; }
        .country-title { font-size: 24px; font-weight: 700; color: #60a5fa; margin-bottom: 2px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
        .stat-card { background: rgba(30, 41, 59, 0.55); padding: 9px 11px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-card .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .stat-card .val { font-size: 13px; font-weight: 600; color: #f8fafc; margin-top: 2px; }

        .fact-section {
            background: rgba(30, 41, 59, 0.35); border-left: 3px solid #3b82f6;
            padding: 10px 13px; border-radius: 0 8px 8px 0; margin-bottom: 9px;
        }
        .fact-section h4 { margin: 0 0 4px 0; font-size: 13px; color: #93c5fd; }
        .fact-section p { margin: 0; font-size: 12.5px; color: #cbd5e1; line-height: 1.5; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        @media (max-width: 900px) {
            .earth-explorer-container { flex-direction: column; }
            .earth-sidebar { width: 100%; height: 55%; }
            .globe-viewport { height: 45%; }
        }
    </style>
</head>
<body>

    <!-- Hidden Audio Player: Put "deep-space-exploration.mp3" in same folder OR pick via button -->
    <audio id="bgMusic" loop preload="auto">
        <source src="deep-space-exploration.mp3" type="audio/mpeg">
    </audio>
    <input type="file" id="audioFileInput" accept="audio/*" style="display:none" onchange="loadCustomAudio(event)">

    <!-- Top-Right Control Panel -->
    <div class="control-panel">
        <div class="instruction-badge">
            <i class="fa-solid fa-earth-americas" style="margin-right: 6px;"></i> Click <span>Earth</span> to explore World Countries
        </div>
        <!-- <button class="music-upload-btn" onclick="document.getElementById('audioFileInput').click()" title="Load Deep Space Exploration MP3 file">
            <i class="fa-solid fa-music"></i> <span id="trackLabel">Select Track MP3</span>
        </button> -->
        <button class="sound-btn" id="soundToggleBtn" onclick="toggleMute()" title="Mute/Unmute Music">
            <i class="fa-solid fa-volume-high" id="soundIcon"></i>
        </button>
        <button class="control-btn" id="pauseBtn" onclick="toggleOrbit()">
            <i class="fa-solid fa-pause" id="pauseIcon"></i> <span id="pauseText">Pause</span>
        </button>
    </div>

    <!-- Orbiting Solar System -->
    <div class="solar-system-stage" id="solarStage">
        <div class="sun" onclick="openPlanetModal('Sun')"></div>
        <div class="orbit murcury"><div class="murcuryshape" onclick="openPlanetModal('Mercury')"></div></div>
        <div class="orbit venus"><div class="venusshape" onclick="openPlanetModal('Venus')"></div></div>
        <div class="orbit earth"><div class="earthshape" onclick="openEarthExplorer()"></div></div>
        <div class="orbit mars"><div class="marsshape" onclick="openPlanetModal('Mars')"></div></div>
        <div class="orbit jupiter"><div class="jupitershape" onclick="openPlanetModal('Jupiter')"></div></div>
        <div class="orbit saturn"><div class="saturnshape" onclick="openPlanetModal('Saturn')"></div></div>
        <div class="orbit uranus"><div class="uranusshape" onclick="openPlanetModal('Uranus')"></div></div>
        <div class="orbit naptune"><div class="naptuneshape" onclick="openPlanetModal('Neptune')"></div></div>
    </div>

    <!-- 3D Planet Info Modal -->
    <div class="modal-overlay" id="planetModal">
        <div class="planet-card">
            <button class="close-btn" style="position:absolute; top:15px; right:15px;" onclick="closePlanetModal()">&times;</button>
            <div id="planet3dBox"></div>
            <div class="planet-info-box">
                <h2 id="pName" style="margin:0 0 8px 0; color:#60a5fa;"></h2>
                <p id="pDesc" style="color:#cbd5e1; font-size:13.5px; line-height:1.6;"></p>
                <div class="stat-grid" style="margin-top:15px;">
                    <div class="stat-card"><div class="label">Mass</div><div class="val" id="pMass"></div></div>
                    <div class="stat-card"><div class="label">Diameter</div><div class="val" id="pDiam"></div></div>
                    <div class="stat-card"><div class="label">Moons</div><div class="val" id="pMoons"></div></div>
                    <div class="stat-card"><div class="label">Orbit Period</div><div class="val" id="pOrbit"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D Earth & Complete World Countries Explorer -->
    <div class="modal-overlay" id="earthExplorerModal">
        <div class="earth-explorer-container">
            <div id="hoverTooltip"></div>

            <div class="globe-viewport">
                <div id="globe3dCanvas"></div>
                <div style="position: absolute; bottom: 15px; left: 15px; background: rgba(15,23,42,0.85); padding: 8px 14px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(255,255,255,0.12);">
                    <i class="fa-solid fa-hand-pointer" style="margin-right: 6px; color:#38bdf8;"></i> Hover or Click on any Country Pin on the 3D Globe
                </div>
            </div>

            <div class="earth-sidebar">
                <div class="sidebar-header">
                    <div class="header-title-group">
                        <span class="header-title"><i class="fa-solid fa-globe"></i> WORLD ATLAS EXPLORER</span>
                        <span class="header-subtitle" id="totalCountBadge">Loading countries...</span>
                    </div>
                    <button class="close-btn" onclick="closeEarthExplorer()" title="Close">&times;</button>
                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="countrySearch" placeholder="Search any country (e.g. India, Japan, Brazil)..." oninput="renderCountryChips()">
                </div>

                <div class="continent-tabs">
                    <button class="tab-btn active" onclick="filterByContinent('All', this)">All World</button>
                    <button class="tab-btn" onclick="filterByContinent('Asia', this)">Asia</button>
                    <button class="tab-btn" onclick="filterByContinent('Europe', this)">Europe</button>
                    <button class="tab-btn" onclick="filterByContinent('Americas', this)">Americas</button>
                    <button class="tab-btn" onclick="filterByContinent('Africa', this)">Africa</button>
                    <button class="tab-btn" onclick="filterByContinent('Oceania', this)">Oceania</button>
                </div>

                <div class="country-chips" id="countryChips"></div>
                <div class="details-panel" id="countryDetails"></div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           AUDIO CONTROLLER FOR "DEEP SPACE EXPLORATION" MP3
           ========================================================= */
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.55;

        let isOrbitPaused = false;
        let isUserMuted = false;

        function tryPlayMusic() {
            if (!isOrbitPaused && !isUserMuted) {
                bgMusic.play().catch(() => {
                    // Browser waits for user interaction or local mp3 file
                });
            }
        }

        function loadCustomAudio(event) {
            const file = event.target.files[0];
            if (!file) return;
            const fileURL = URL.createObjectURL(file);
            bgMusic.src = fileURL;
            document.getElementById('trackLabel').innerText = file.name.slice(0, 18) + (file.name.length > 18 ? '...' : '');
            if (!isOrbitPaused && !isUserMuted) {
                bgMusic.play();
            }
        }

        // Auto-start music on first click anywhere on screen
        document.addEventListener('pointerdown', () => {
            if (bgMusic.paused && !isOrbitPaused && !isUserMuted) {
                tryPlayMusic();
            }
        });

        function toggleMute() {
            isUserMuted = !isUserMuted;
            bgMusic.muted = isUserMuted;
            const icon = document.getElementById('soundIcon');
            icon.className = isUserMuted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
            if (!isUserMuted && !isOrbitPaused) {
                tryPlayMusic();
            }
        }

        /* Orbit Pause/Resume (Syncs with Music Pause/Play) */
        function toggleOrbit() {
            const stage = document.getElementById('solarStage');
            const icon = document.getElementById('pauseIcon');
            const text = document.getElementById('pauseText');
            isOrbitPaused = !isOrbitPaused;
            
            if (isOrbitPaused) {
                stage.classList.add('paused');
                icon.className = 'fa-solid fa-play';
                text.innerText = 'Resume';
                
            } else {
                stage.classList.remove('paused');
                icon.className = 'fa-solid fa-pause';
                text.innerText = 'Pause';
                tryPlayMusic();
            }
        }

        /* Planets Data & 3D Preview */
        const planetData = {
            Sun: { name: "Sun (सूर्य)", color: 0xffaa00, mass: "1.989 × 10^30 kg", diam: "1,392,700 km", moons: "8 Planets", orbit: "230M Yrs", desc: "The Sun is a G-type main-sequence star at the center of our Solar System. It accounts for 99.86% of the total mass of the entire Solar System." },
            Mercury: { name: "Mercury (बुध)", color: 0x9ca3af, mass: "3.301 × 10^23 kg", diam: "4,879 km", moons: "0", orbit: "88 Days", desc: "Mercury is the smallest and innermost planet in the Solar System. Its surface is heavily cratered and resembles Earth's Moon." },
            Venus: { name: "Venus (शुक्र)", color: 0xfde047, mass: "4.867 × 10^24 kg", diam: "12,104 km", moons: "0", orbit: "225 Days", desc: "Venus is the hottest planet in our Solar System with surface temperatures reaching 475°C due to a dense carbon dioxide greenhouse atmosphere." },

                pMesh.add(ring);

        async function loadAllWorldCountries() {
            try {
                // Fast & reliable CDN URL jo bina CORS error ke 250+ countries deta hai
                const res = await fetch('https://raw.githubusercontent.com/mledoze/countries/master/countries.json');
                if (!res.ok) throw new Error("Network error");
                const data = await res.json();
                
                allCountriesList = data
                    .filter(c => c.latlng && c.latlng.length === 2 && c.independent !== false)
                    .map(c => {
                        const currObj = c.currencies ? Object.values(c.currencies)[0] : null;
                        const currStr = currObj ? `${currObj.name} (${currObj.symbol || ''})` : 'N/A';
                        const langStr = c.languages ? Object.values(c.languages).slice(0, 3).join(', ') : 'N/A';
                        
                        return {
                            id: c.cca3,
                            name: c.name.common,
                            officialName: c.name.official,
                            flag: c.flag || "🏳️",
                            cont: c.region || "Other",
                            subregion: c.subregion || c.region || "Global",
                            lat: c.latlng[0],
                            lng: c.latlng[1],
                            capital: (c.capital && c.capital[0]) ? c.capital[0] : "N/A",
                            pop: c.area ? `${(c.area * 85).toLocaleString()} (Est.)` : "N/A",
                            area: c.area ? `${c.area.toLocaleString()} km²` : "N/A",
                            curr: currStr,
                            lang: langStr,
                            borders: (c.borders && c.borders.length > 0) ? c.borders.join(', ') : "Island / No Land Borders",
                            timezone: "UTC"
                        };
                    })
                    .sort((a, b) => a.name.localeCompare(b.name));

                document.getElementById('totalCountBadge').innerText = `${allCountriesList.length} Countries Loaded`;
                if(document.getElementById('earthExplorerModal').classList.contains('active')) {
                    renderCountryChips();
                }
            } catch (err) {
                allCountriesList = [...fallbackCountries];
                document.getElementById('totalCountBadge').innerText = `${allCountriesList.length} Major Countries Loaded`;
            }
        }
        loadAllWorldCountries();

        function closeEarthExplorer() { 
            document.getElementById('earthExplorerModal').classList.remove('active'); 
            document.getElementById('hoverTooltip').style.display = 'none';
        }

        function init3DGlobe() {
            const container = document.getElementById('globe3dCanvas');
            const w = container.clientWidth || 600;
            const h = container.clientHeight || 500;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
            camera.position.z = 165;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.minDistance = 85;
                controls.maxDistance = 300;
            }

            scene.add(new THREE.AmbientLight(0xffffff, 1.1));
            const light = new THREE.DirectionalLight(0xffffff, 0.7);
            light.position.set(5, 3, 5);
            scene.add(light);

            const loader = new THREE.TextureLoader();
            loader.setCrossOrigin('anonymous');
            
            const earthGeo = new THREE.SphereGeometry(60, 64, 64);
            const earthMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.65,
                metalness: 0.1
            });

            loader.load(
                'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
                (tex) => {
                    earthMat.map = tex;
                    earthMat.needsUpdate = true;
                },
                undefined,
                () => {
                    const mapCanvas = document.createElement('canvas');
                    mapCanvas.width = 1024; mapCanvas.height = 512;
                    const ctx = mapCanvas.getContext('2d');
                    ctx.fillStyle = '#0b2545'; ctx.fillRect(0,0,1024,512);
                    ctx.fillStyle = '#134e4a';
                    ctx.beginPath(); ctx.ellipse(650, 200, 180, 100, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(300, 240, 120, 180, 0.4, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(850, 360, 60, 45, 0, 0, Math.PI*2); ctx.fill();
                    earthMat.map = new THREE.CanvasTexture(mapCanvas);
                    earthMat.needsUpdate = true;
                }
            );

            globe = new THREE.Mesh(earthGeo, earthMat);
            scene.add(globe);

            const atmoGeo = new THREE.SphereGeometry(61.5, 64, 64);
            const atmoMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.12,
                side: THREE.BackSide
            });
            globe.add(new THREE.Mesh(atmoGeo, atmoMat));

            const pinGeo = new THREE.SphereGeometry(1.1, 12, 12);
            allCountriesList.forEach(c => {
                const phi = (90 - c.lat) * (Math.PI / 180);
                const theta = (c.lng + 180) * (Math.PI / 180);
                const x = -(60.4 * Math.sin(phi) * Math.cos(theta));
                const z = (60.4 * Math.sin(phi) * Math.sin(theta));
                const y = (60.4 * Math.cos(phi));

                const pinMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
                const pin = new THREE.Mesh(pinGeo, pinMat);
                pin.position.set(x, y, z);
                pin.userData = { country: c };
                globe.add(pin);
                pinsArray.push(pin);
            });

            const tooltip = document.getElementById('hoverTooltip');

            container.addEventListener('mousemove', (event) => {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(pinsArray);

                if (intersects.length > 0) {
                    const country = intersects[0].object.userData.country;
                    tooltip.innerHTML = `${country.flag} ${country.name} <span style="color:#94a3b8; font-weight:400;">(${country.capital})</span>`;
                    tooltip.style.left = event.clientX + 'px';
                    tooltip.style.top = event.clientY + 'px';
                    tooltip.style.display = 'block';
                    container.style.cursor = 'pointer';
                } else {
                    tooltip.style.display = 'none';
                    container.style.cursor = 'grab';
                }
            });

            container.addEventListener('click', () => {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(pinsArray);
                if (intersects.length > 0) {
                    const country = intersects[0].object.userData.country;
                    selectCountry(country.id);
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                if (controls) controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                if(!container || !renderer) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function focusCoordinates(lat, lng) {
            if(!globe) return;
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            globe.rotation.y = -theta + Math.PI / 2;
            globe.rotation.x = phi - Math.PI / 2;
        }

        function filterByContinent(cont, btn) {
            activeContinent = cont;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderCountryChips();
        }

        function renderCountryChips() {
            const query = document.getElementById('countrySearch').value.toLowerCase().trim();
            const container = document.getElementById('countryChips');
            
            const filtered = allCountriesList.filter(c => {
                const matchesCont = activeContinent === 'All' || c.cont === activeContinent;
                const matchesSearch = c.name.toLowerCase().includes(query) || 
                                      (c.capital && c.capital.toLowerCase().includes(query));
                return matchesCont && matchesSearch;
            });

            container.innerHTML = filtered.map(c => `
                <div class="chip" id="chip-${c.id}" onclick="selectCountry('${c.id}')">
                    ${c.flag} ${c.name}
                </div>
            `).join('');

            if(filtered.length > 0 && query.length > 0) {
                selectCountry(filtered[0].id);
            }
        }

        function selectCountry(id) {
            const country = allCountriesList.find(c => c.id === id);
            if (!country) return;

            document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
            const activeChip = document.getElementById(`chip-${id}`);
            if (activeChip) {
                activeChip.classList.add('active');
                activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            pinsArray.forEach(p => {
                if (p.userData.country.id === id) {
                    p.material.color.setHex(0xef4444);
                    p.scale.set(1.8, 1.8, 1.8);
                } else {
                    p.material.color.setHex(0xfacc15);
                    p.scale.set(1, 1, 1);
                }
            });

            const custom = detailedKnowledge[country.name];
            const geoText = custom ? custom.geo : `${country.name} is located in the ${country.subregion || country.cont} region at coordinates ${country.lat.toFixed(2)}°, ${country.lng.toFixed(2)}°, spanning a total geographical area of ${country.area}.`;
            const historyText = custom ? custom.history : `${country.officialName || country.name} has a distinct regional identity within ${country.subregion || country.cont}, sharing land borders with: ${country.borders}.`;
            const cultureText = custom ? custom.culture : `Primary spoken languages include ${country.lang}. The nation operates in the ${country.timezone} timezone with ${country.capital} serving as its administrative capital.`;
            const funText = custom ? custom.fun : `${country.name} uses ${country.curr} as its official currency and supports a population of ${country.pop} people.`;

            document.getElementById('countryDetails').innerHTML = `
                <div class="country-title">${country.flag} ${country.name}</div>
                <div style="color:#94a3b8; font-size:12.5px; margin-bottom:10px;">
                    Official: <strong>${country.officialName || country.name}</strong> • Region: <strong>${country.subregion || country.cont}</strong>
                </div>

                <div class="stat-grid">
                    <div class="stat-card"><div class="label">Capital City</div><div class="val">${country.capital}</div></div>
                    <div class="stat-card"><div class="label">Population</div><div class="val">${country.pop}</div></div>
                    <div class="stat-card"><div class="label">Total Area</div><div class="val">${country.area}</div></div>
                    <div class="stat-card"><div class="label">Currency</div><div class="val">${country.curr}</div></div>
                    <div class="stat-card"><div class="label">Languages</div><div class="val">${country.lang}</div></div>
                    <div class="stat-card"><div class="label">Timezone</div><div class="val">${country.timezone}</div></div>
                </div>

                <div class="fact-section">
                    <h4><i class="fa-solid fa-mountain-sun" style="margin-right:6px;"></i> Geography & Location</h4>
                    <p>${geoText}</p>
                </div>
                <div class="fact-section">
                    <h4><i class="fa-solid fa-landmark" style="margin-right:6px;"></i> Heritage & Borders</h4>
                    <p>${historyText}</p>
                </div>
                <div class="fact-section">
                    <h4><i class="fa-solid fa-users" style="margin-right:6px;"></i> Society & Culture</h4>
                    <p>${cultureText}</p>
                </div>
                <div class="fact-section" style="border-left-color: #f59e0b;">
                    <h4 style="color: #fbbf24;"><i class="fa-solid fa-lightbulb" style="margin-right:6px;"></i> Key Highlight</h4>
                    <p>${funText}</p>
                </div>
            `;

            focusCoordinates(country.lat, country.lng);
        }
    </script>
</body>
</html>
